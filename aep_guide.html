<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEP Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: 'M PLUS Rounded 1c', sans-serif;
  --bg: #f5f0eb;
  --card: #ffffff;
  --border: #333;
  --text: #333;
  --mint: #78c8a8;
  --mint-light: #d8f0e8;
  --coral: #e87870;
  --coral-light: #fce8e6;
  --sky: #68b8e0;
  --sky-light: #d8eef8;
  --gold: #e8c040;
  --gold-light: #f8f0cc;
  --lavender: #b878d0;
  --lavender-light: #ecdaf4;
  --orange: #e89050;
  --orange-light: #fcecd8;
  --green: #5cb87a;
  --green-light: #d6f0df;
}
/* 文字サイズは rem で指定し、端末のフォントサイズ設定に追随させる */
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 1.5rem 16px 3rem;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "★ ✦ ★ ✦ ★ ✦ ★ ✦ ★ ✦ ★";
  position: fixed;
  top: 10px; left: 0; right: 0;
  text-align: center;
  font-size: 0.69rem;
  color: #ccc;
  letter-spacing: 18px;
  pointer-events: none;
  z-index: 0;
}
.page-wrap { max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }

/* --- Guide language toggle (page top) --- */
.glang-bar {
  display: flex; justify-content: center; gap: 8px;
  margin-bottom: 18px;
}
.glang-pill {
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.3em 1.1em; font-family: var(--font);
  font-size: 0.75rem; font-weight: 800; cursor: pointer;
  background: white; color: var(--text);
  transition: transform 0.1s, background 0.15s, color 0.15s;
}
.glang-pill:active { transform: scale(0.95); }
.glang-pill.active { background: var(--border); color: white; }

/* --- Language switcher (page top, no scroll needed) --- */
.top-lang-switch { margin-top: 0; margin-bottom: 18px; }

/* --- Hero --- */
.hero { text-align: center; margin-bottom: 20px; }
.hero-badge {
  display: inline-block; background: var(--coral); color: white;
  border: 2.5px solid var(--border); border-radius: 99px;
  padding: 0.25em 1.4em; font-size: 0.69rem; font-weight: 800;
  letter-spacing: 2px; margin-bottom: 10px;
}
.hero h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
.hero h1 span.username { color: var(--coral); -webkit-text-stroke: 1.5px var(--border); paint-order: stroke fill; }
.hero p { font-size: 0.75rem; font-weight: 700; color: #888; line-height: 1.7; }

/* --- Cards --- */
.card {
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: 20px; padding: 20px 22px;
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.card-tag {
  position: absolute; top: -1px; left: 18px; color: white;
  border: 2px solid var(--border); border-top: none;
  border-radius: 0 0 10px 10px; font-size: 0.63rem; font-weight: 800;
  padding: 0.25em 1em; letter-spacing: 1px;
}
.card h2 {
  font-size: 1.125rem; font-weight: 800;
  margin-bottom: 12px; margin-top: 8px; line-height: 1.4;
  display: flex; align-items: center; gap: 8px;
}
.card h2 .dot {
  width: 11px; height: 11px; border-radius: 99px;
  border: 2px solid var(--border); display: inline-block; flex-shrink: 0;
}
.card.mint  .card-tag, .card.mint  .dot { background: var(--mint); }
.card.sky   .card-tag, .card.sky   .dot { background: var(--sky); }
.card.gold  .card-tag { background: var(--gold); color: #333; }
.card.gold  .dot { background: var(--gold); }
.card.lavender .card-tag, .card.lavender .dot { background: var(--lavender); }
.card.orange .card-tag, .card.orange .dot { background: var(--orange); }
.card.coral .card-tag, .card.coral .dot { background: var(--coral); }
.card.green .card-tag, .card.green .dot { background: var(--green); }

/* mode blocks */
.mode-block {
  border: 2px dashed var(--border); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 12px;
}
.mode-block:last-child { margin-bottom: 0; }
.mode-label {
  display: inline-block; font-size: 0.63rem; font-weight: 800;
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.3em 1.2em; margin-bottom: 9px; color: white; letter-spacing: 1px;
}
.mode-block p { font-size: 0.9rem; font-weight: 700; line-height: 1.85; color: #444; }
.trigger {
  display: inline-block; background: var(--gold-light);
  border: 1.5px solid var(--gold); border-radius: 8px;
  padding: 0.1em 0.65em; font-size: 0.81rem; font-weight: 800;
  color: #987800; margin: 0 2px;
}

/* step list */
.step-list { list-style: none; display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
.step-list li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 0.84rem; font-weight: 700; line-height: 1.75; color: #444;
}
.step-num {
  width: 24px; height: 24px; border-radius: 99px;
  border: 2px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  font-size: 0.69rem; font-weight: 800; color: white;
  flex-shrink: 0; margin-top: 2px;
}
.cmd {
  display: inline-block; background: var(--sky-light);
  border: 1.5px solid var(--sky); border-radius: 8px;
  padding: 0.1em 0.7em; font-size: 0.78rem; font-weight: 800;
  color: #1870a8; white-space: nowrap;
}
.cmd-apple {
  display: inline-block; background: var(--green-light);
  border: 1.5px solid var(--green); border-radius: 8px;
  padding: 0.1em 0.7em; font-size: 0.78rem; font-weight: 800;
  color: #2a7a48; white-space: nowrap;
}

/* tip box */
.tip-box {
  background: var(--gold-light); border: 2px dashed var(--gold);
  border-radius: 14px; padding: 12px 16px;
  font-size: 0.81rem; font-weight: 700; color: #7a6000; line-height: 1.85; margin-top: 12px;
}
.tip-box strong { color: #987800; font-weight: 800; }

/* cat grid */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.cat-item {
  border: 2px solid var(--border); border-radius: 12px;
  padding: 0.5em 0.9em; font-size: 0.78rem; font-weight: 700;
  display: flex; align-items: center; gap: 7px;
}
.cat-dot { width: 8px; height: 8px; border-radius: 99px; border: 1.5px solid var(--border); flex-shrink: 0; }

/* CEFR grid */
.cefr-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 4px; }
.cefr-cell { border: 2px solid var(--border); border-radius: 10px; padding: 0.4em 0.2em; text-align: center; }
.cefr-cell .level { font-size: 0.84rem; font-weight: 800; }
.cefr-cell .range { font-size: 0.56rem; font-weight: 700; color: #666; margin-top: 2px; line-height: 1.3; }

/* setup steps */
.setup-step { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
.setup-step:last-child { margin-bottom: 0; }
.setup-step-num {
  width: 30px; height: 30px; border-radius: 99px;
  background: var(--coral); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.88rem; font-weight: 800; color: white;
  flex-shrink: 0; margin-top: 1px;
}
.setup-step-body { flex: 1; min-width: 0; }
.setup-step-title { font-size: 0.97rem; font-weight: 800; margin-bottom: 4px; line-height: 1.45; }
.setup-step-desc { font-size: 0.84rem; font-weight: 700; color: #666; line-height: 1.9; }
.setup-step-desc .hl {
  display: inline-block; background: var(--coral-light);
  border: 1px solid var(--coral); border-radius: 6px;
  padding: 0 7px; color: var(--coral); font-weight: 800;
}
.setup-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, #ddd 0, #ddd 6px, transparent 6px, transparent 12px);
  margin: 14px 0;
}

/* settings box (inside Getting Started) */
.setup-box {
  background: var(--coral-light); border: 2px dashed var(--coral);
  border-radius: 14px; padding: 12px 14px; margin-top: 10px;
}
.setup-box-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.setup-box-row:last-child { margin-bottom: 0; }
.setup-box-label {
  font-size: 0.72rem; font-weight: 800; color: var(--coral);
  white-space: nowrap; min-width: 4.5em;
}
.pill-group { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.lang-pill {
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.35em 0.9em; font-family: var(--font);
  font-size: 0.75rem; font-weight: 800; cursor: pointer;
  background: white; color: var(--text);
  transition: transform 0.1s, background 0.15s, color 0.15s;
}
.lang-pill:active { transform: scale(0.95); }
.lang-pill.active { background: var(--coral); color: white; }
.lang-pill.disabled { opacity: 0.35; pointer-events: none; }
.level-pill {
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.35em 0.85em; font-family: var(--font);
  font-size: 0.72rem; font-weight: 800; cursor: pointer;
  background: white; color: var(--text);
  transition: transform 0.1s, background 0.15s, color 0.15s;
}
.level-pill:active { transform: scale(0.95); }
.level-pill.active { color: white; }
.level-pill[data-level="A1"].active  { background: #e85858; }
.level-pill[data-level="A2"].active  { background: #e88030; }
.level-pill[data-level="B1"].active  { background: #d8b028; }
.level-pill[data-level="B2"].active  { background: #60b050; }
.level-pill[data-level="C1"].active  { background: #48a0d0; }
.level-pill[data-level="C1+"].active { background: #b068c8; }
.setup-box input[type="text"] {
  flex: 1; min-width: 100px;
  border: 2px solid var(--border);
  border-radius: 99px; padding: 0.45em 1em;
  font-family: var(--font); font-size: 0.88rem; font-weight: 700;
  outline: none; background: white; color: var(--text);
}
.setup-box input[type="text"]:focus { border-color: var(--coral); }

/* prompt box */
.prompt-box {
  background: #1e1e2e; border: 2px solid var(--border);
  border-radius: 14px; padding: 14px 16px;
  font-family: monospace; font-size: 0.69rem; line-height: 1.75;
  color: #cdd6f4; white-space: pre-wrap; word-break: break-word;
  max-height: 260px; overflow-y: auto; margin-top: 10px;
}
.prompt-name-highlight  { color: #a6e3a1; font-weight: 800; }
.prompt-level-highlight { color: #f9e2af; font-weight: 800; }
.copy-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 10px; width: 100%; padding: 0.85em 1.4em;
  border-radius: 99px; background: #1e1e2e; color: #cdd6f4;
  border: 2.5px solid var(--border); font-family: var(--font);
  font-size: 0.84rem; font-weight: 800; cursor: pointer; letter-spacing: 1px;
  transition: background 0.15s, color 0.15s;
}
.copy-btn.copied { background: var(--mint); color: white; }

/* app link */
.app-link {
  display: flex; align-items: center; gap: 14px;
  background: white; border: 2px solid var(--border); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 12px; text-decoration: none;
  transition: transform 0.12s, box-shadow 0.12s; box-shadow: 3px 3px 0 var(--border);
}
.app-link:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--border); }
.app-link img {
  width: 52px; height: 52px; border-radius: 12px;
  border: 1.5px solid #ddd; background: white; flex-shrink: 0;
}
.app-link .app-name { font-size: 1rem; font-weight: 800; color: var(--text); }
.app-link .app-sub { font-size: 0.81rem; font-weight: 700; color: #888; margin-top: 3px; }
.app-note {
  font-size: 0.75rem; font-weight: 700; color: #888; line-height: 1.8; margin-top: 10px;
}

/* chart btn */
.chart-btn-wrap { text-align: center; margin-top: 18px; }
.chart-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--lavender); color: white;
  border: 2.5px solid var(--border); border-radius: 99px;
  padding: 0.8em 1.9em; font-family: var(--font);
  font-size: 0.88rem; font-weight: 800; cursor: pointer; letter-spacing: 1px;
  transition: transform 0.12s, box-shadow 0.12s;
  box-shadow: 4px 4px 0 var(--border);
}
.chart-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--border); }
.chart-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--border); }
.chart-btn .btn-dot { width: 8px; height: 8px; background: white; border-radius: 99px; border: 1.5px solid var(--border); flex-shrink: 0; }

.footer { text-align: center; margin-top: 28px; font-size: 0.72rem; font-weight: 700; color: #bbb; letter-spacing: 1px; }

/* --- Modal --- */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 100;
  align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: white; border: 2.5px solid var(--border);
  border-radius: 24px; width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;
}
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: var(--coral-light); border: 2px solid var(--border);
  border-radius: 99px; width: 30px; height: 30px;
  font-size: 0.88rem; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); color: var(--border); transition: transform 0.1s;
}
.modal-close:hover { transform: scale(1.1); }
.modal-title { font-size: 0.88rem; font-weight: 800; color: var(--lavender); margin-bottom: 12px; -webkit-text-stroke: 0.5px var(--border); paint-order: stroke fill; }
.modal-subtitle { font-size: 0.72rem; font-weight: 700; color: #888; margin-bottom: 12px; line-height: 1.7; }
.json-area {
  width: 100%; height: 190px;
  border: 2px dashed var(--lavender); border-radius: 14px;
  padding: 12px 14px; font-family: monospace; font-size: 0.72rem;
  resize: vertical; outline: none;
  background: var(--lavender-light); color: var(--text); line-height: 1.6;
}
.json-error { font-size: 0.72rem; color: #b83030; margin-top: 6px; background: #fce8e8; border-radius: 8px; padding: 5px 10px; border: 1px dashed var(--coral); font-weight: 700; display: none; }
.json-error.show { display: block; }
.gen-btn {
  margin-top: 10px; width: 100%; padding: 0.85em 1.7em;
  border-radius: 99px; background: var(--lavender); color: white;
  border: 2.5px solid var(--border); font-family: var(--font);
  font-size: 0.84rem; font-weight: 800; cursor: pointer; letter-spacing: 1px; transition: transform 0.1s;
}
.gen-btn:active { transform: scale(0.98); }
#chart-output { margin-top: 16px; display: none; }
#chart-output.show { display: block; }

/* score card */
.sc-wrap { font-family: var(--font); border: 2.5px solid var(--border); border-radius: 24px; padding: 10px 18px 18px; }
.sc-header-badge { display: flex; justify-content: center; margin-bottom: 6px; }
.sc-badge { display: inline-flex; align-items: center; gap: 5px; color: white; border-radius: 99px; border: 2px solid var(--border); padding: 0.25em 1em; font-size: 0.63rem; font-weight: 800; letter-spacing: 2px; }
.sc-dot { width: 6px; height: 6px; border-radius: 99px; border: 1px solid var(--border); }
.sc-score-row { display: flex; align-items: center; margin-bottom: 8px; }
.sc-cefr-col { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; }
.sc-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.sc-score-card { background: white; border-radius: 20px; border: 2.5px solid var(--border); text-align: center; width: 140px; padding: 8px 0 11px; }
.sc-total { font-size: 2.75rem; font-weight: 800; line-height: 1; -webkit-text-stroke: 3px var(--border); paint-order: stroke fill; }
.sc-max { font-size: 0.69rem; color: #333; font-weight: 700; }
.sc-date { font-size: 0.69rem; color: #333; font-weight: 700; text-align: center; }
.sc-bar-col { width: 44px; flex-shrink: 0; display: flex; justify-content: flex-end; }
.sc-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.sc-bar-pct { font-size: 0.63rem; font-weight: 800; -webkit-text-stroke: 1px var(--border); paint-order: stroke fill; line-height: 1; }
.sc-bar-track { width: 13px; height: 76px; border-radius: 99px; border: 2px solid var(--border); position: relative; overflow: hidden; }
.sc-bar-fill { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 99px; }
.sc-radar-area { background: white; border-radius: 18px; padding: 10px 4px; margin-bottom: 10px; }
.sc-conversion-grid { display: grid; gap: 7px; margin-bottom: 10px; }
.sc-conv-card { background: white; border-radius: 14px; border: 2px dashed; padding: 6px 8px 10px; text-align: center; }
.sc-conv-label { font-size: 0.56rem; color: #333; margin-bottom: 3px; font-weight: 700; }
.sc-conv-value { font-size: 0.88rem; font-weight: 800; -webkit-text-stroke: 1.5px var(--border); paint-order: stroke fill; }
.sc-conv-unit { font-size: 0.56rem; font-weight: 700; color: #333; -webkit-text-stroke: 0; }
.sc-comment-box { background: white; border-radius: 14px; border: 2px dashed; padding: 12px 14px 13px; position: relative; }
.sc-comment-label { position: absolute; top: -10px; left: 12px; color: white; border: 1.5px solid var(--border); font-size: 0.56rem; font-weight: 800; border-radius: 99px; padding: 0.2em 1em; line-height: 1.4; }
.sc-comment-text { font-size: 0.63rem; color: #333; line-height: 1.8; padding-top: 2px; font-weight: 700; }
</style>
</head>
<body>
<div class="page-wrap">

  <!-- Guide language toggle -->
  <div class="glang-bar">
    <button class="glang-pill active" data-glang="ja">日本語</button>
    <button class="glang-pill" data-glang="en">English</button>
  </div>

  <!-- Language switcher (moved to page top: switchable without scrolling) -->
  <div class="setup-box top-lang-switch">
    <div class="setup-box-row">
      <span class="setup-box-label" id="lbl-native"></span>
      <div class="pill-group" id="native-pills"></div>
    </div>
    <div class="setup-box-row">
      <span class="setup-box-label" id="lbl-target"></span>
      <div class="pill-group" id="target-pills"></div>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-badge"><span id="guide-badge">AEP GUIDE</span></div>
    <h1 id="hero-title"></h1>
    <p id="hero-sub"></p>
  </div>

  <!-- Overview -->
  <div class="card mint">
    <div class="card-tag">OVERVIEW</div>
    <h2><span class="dot"></span><span id="ov-title"></span></h2>
    <div class="mode-block" style="background: var(--mint-light); border-color: var(--mint);">
      <p id="ov-body"></p>
    </div>
    <div class="tip-box" id="ov-tip"></div>
  </div>

  <!-- Modes -->
  <div class="card sky">
    <div class="card-tag">HOW TO USE</div>
    <h2><span class="dot"></span><span id="modes-title"></span></h2>
    <div class="mode-block">
      <div class="mode-label" style="background: var(--sky);" id="mode1-label"></div>
      <p id="mode1-body"></p>
    </div>
    <div class="mode-block">
      <div class="mode-label" style="background: var(--coral);" id="mode2-label"></div>
      <p id="mode2-body"></p>
    </div>
  </div>

  <!-- Commands -->
  <div class="card orange">
    <div class="card-tag">COMMANDS</div>
    <h2><span class="dot"></span><span id="commands-title"></span></h2>
    <ul class="step-list" id="commands-list"></ul>
    <div class="tip-box" style="margin-top:12px;" id="commands-tip"></div>
  </div>

  <!-- Getting Started -->
  <div class="card coral">
    <div class="card-tag">GETTING STARTED</div>
    <h2><span class="dot"></span><span id="gs-title"></span></h2>

    <div class="setup-step">
      <div class="setup-step-num">1</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st1-title"></div>
        <div class="setup-step-desc" id="st1-desc"></div>
        <div class="setup-box">
          <div class="setup-box-row">
            <span class="setup-box-label" id="lbl-name"></span>
            <input type="text" id="username-input" value="CA" maxlength="20">
          </div>
          <div class="setup-box-row">
            <span class="setup-box-label" id="lbl-level"></span>
            <div class="pill-group" id="level-pills"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">2</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st2-title"></div>
        <div class="setup-step-desc" id="st2-desc"></div>
        <div class="prompt-box" id="prompt-preview"></div>
        <button class="copy-btn" id="copy-btn"></button>
      </div>

- ${diaryLen}
- ${N} entry: match the content naturally. No strict length limit — not a word-for-word translation.
- Do not start either entry with a "today" opener (${todayList}) — vary the opening naturally.

---

## ${cmd.reading}（+ transcribed text）

**Trigger:** ${name} inputs「${cmd.reading}」followed by transcribed text

${name} reads the diary ${L} entry aloud using smartphone voice input and pastes the transcribed result. Compare the transcription against the original diary ${L} entry. Identify words or phrases where the transcription differs from the original.

Format:
${readingHead} #[number]

${readingFix}
・[correct word] [${t.ph}] → [brief pronunciation tip in ${N}]

If there are no differences, output:
${readingHead} #[number]

${readingPerfect}

**Rules:**
- Number each reading session sequentially within the thread (${readingHead} #1, #2, #3…). Separate count from Role-Play.
- Compare by sound only — ignore homophones, alternate spellings, hyphens, brackets, punctuation, capitalization. Flag only when the actual sound differs.
- Always show the correct word — not the misread version. Provide the ${t.ph} of the correct word and practical advice on how to pronounce it correctly.
- Do not describe or explain the incorrect reading.
- Do not comment on words that were transcribed correctly.
- Tips concise, in ${N}.

---

## Role-Play（${name} / ${char}）

**Trigger:** ${name} types「${name}」or「${char}」

Replay the「${cmd.ideal}」script line by line as a role-play.

Format:
${rpHead} #[number]

**Rules:**
- Number sequentially within the thread (separate count from ${cmd.reading}).
- ${name} delivers one line at a time. After each line, give brief pronunciation feedback.
- Stay in order — do not skip lines.
- If ${name} types「${name}」: ${name} speaks as themselves; ${char} listens and feeds back.
- If ${name} types「${char}」: ${name} speaks ${char}'s line; ${char} confirms delivery and feeds back.
- Keep feedback concise — one or two points per turn.

---

## ${cmd.harvest}

**Trigger:** ${name} inputs「${cmd.harvest}」

Read the entire conversation and the diary entry from this thread. Extract vocabulary in three categories:

1. **Words ${name} couldn't say** — words or phrases ${name} was trying to express but couldn't find, used incorrectly, or visibly struggled with.
2. **Key words from today's diary** — important words or phrases that appeared in the diary entry and are worth remembering.
3. **High-frequency everyday ${L}** — common expressions from the conversation that are useful in daily conversation.

Output, preceded by:
${harvestLead}

${F}json
[
  {
    "w": "[word or phrase in ${L}]",
    "ph": "[${t.ph}]",
    "jp": "[${N} translation]",
    "ex": "[example sentence in ${L}]",
    "exJp": "[${N} translation of the example sentence]"
  }
]
${F}

**Rules:**
- Output exactly 10 items across all three categories.
- Example sentences from ${name}'s own lines only — the corrected「${cmd.ideal}」versions or diary expressions. Never ${char}'s lines or uncorrected speech.
- "jp" and "exJp" in ${N} only — no ${L}, including the target word itself.
- Do not include words ${name} already used correctly and fluently.
- All translations should be natural, not literal.${jaJsonNote}
- **Character limits (including spaces):**
  - "w" (word/phrase): 20 characters or fewer
  - "jp" (translation): ${jpLim} characters or fewer
  - "ex" (example sentence): 60 characters or fewer
  - "exJp" (example translation): ${exJpLim} characters or fewer
  - If a natural output exceeds these limits, shorten it without changing the meaning.

---

At the end of every response — **except during ${char} mode (Mode 1) and Role-Play** — display the following exactly as written:

${menu}`;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ---- 描画 ----
function ctx() {
  const t = TARGETS[target];
  const charDisp = t.charNote
    ? (guideLang === 'ja' ? `${t.char}（${t.charNote}）` : `${t.char} (${t.charNote})`)
    : t.char;
  const appUiName = guideLang === 'ja'
    ? (t.appUiLang === 'ja' ? '日本語' : '英語')
    : (t.appUiLang === 'ja' ? 'Japanese' : 'English');
  return {
    name: currentName, level: currentLevel, target, native,
    project: t.project, projectFull: t.projectFull, char: t.char, charDisp,
    app: t.app, appUrl: t.appUrl, hello: t.hello, play: t.play,
    tName: LANG_NAMES[guideLang][target], tNameEn: LANG_NAMES.en[target],
    nName: NATIVE_NAMES[guideLang][native],
    cmd: COMMANDS[native], reOut: LANG_NAMES[native][target],
    appUiName,
  };
}

function buildPills() {
  // クリック処理はコンテナ側のイベントデリゲーションで拾う（インラインonclickは使わない）
  const np = document.getElementById('native-pills');
  np.innerHTML = ['ja', 'en'].map(n =>
    `<button class="lang-pill${n === native ? ' active' : ''}" data-native="${n}">${n === 'ja' ? '🇯🇵' : '🇺🇸'} ${NATIVE_NAMES[guideLang][n === 'ja' ? 'ja' : 'en']}</button>`
  ).join('');
  const tp = document.getElementById('target-pills');
  tp.innerHTML = Object.keys(TARGETS).map(k => {
    const dis = k === native ? ' disabled' : '';
    return `<button class="lang-pill${k === target ? ' active' : ''}${dis}" data-target="${k}">${TARGETS[k].flag} ${LANG_NAMES[guideLang][k]}</button>`;
  }).join('');
  const lp = document.getElementById('level-pills');
  lp.innerHTML = LEVELS.map(l =>
    `<button class="level-pill${l === currentLevel ? ' active' : ''}" data-level="${l}">${l}</button>`
  ).join('');
}

function updatePromptPreview() {
  const el = document.getElementById('prompt-preview');
  const text = buildPrompt(currentName, currentLevel, native, target);
  let highlighted = esc(text);
  if (currentName) {
    highlighted = highlighted.replace(
      new RegExp(esc(currentName).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'),
      `<span class="prompt-name-highlight">${esc(currentName)}</span>`
    );
  }
  highlighted = highlighted.replace(
    new RegExp(`${currentLevel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} \\(CEFR\\)`, 'g'),
    `<span class="prompt-level-highlight">${currentLevel} (CEFR)</span>`
  );
  el.innerHTML = highlighted;
}

function render() {
  const tx = T[guideLang];
  const c = ctx();
  const get = v => (typeof v === 'function' ? v(c) : v);
  document.documentElement.lang = guideLang;
  document.title = get(tx.title);
  document.querySelectorAll('.glang-pill').forEach(p => p.classList.toggle('active', p.dataset.glang === guideLang));
  buildPills();

  const map = {
    'guide-badge': tx.badge, 'hero-title': tx.heroTitle, 'hero-sub': tx.heroSub,
    'ov-title': tx.ovTitle, 'ov-body': tx.ovBody, 'ov-tip': tx.ovTip,
    'modes-title': tx.modesTitle,
    'mode1-label': tx.mode1Label, 'mode1-body': tx.mode1Body,
    'mode2-label': tx.mode2Label, 'mode2-body': tx.mode2Body,
    'commands-title': tx.commandsTitle, 'commands-tip': tx.commandsTip,
    'gs-title': tx.gsTitle,
    'lbl-native': tx.lblNative, 'lbl-target': tx.lblTarget,
    'lbl-name': tx.lblName, 'lbl-level': tx.lblLevel,
    'st1-title': tx.st1Title, 'st1-desc': tx.st1Desc,
    'st2-title': tx.st2Title, 'st2-desc': tx.st2Desc,
    'st3-title': tx.st3Title, 'st3-desc': tx.st3Desc,
    'st4-title': tx.st4Title, 'st4-desc': tx.st4Desc,
    'st5-title': tx.st5Title, 'st5-desc': tx.st5Desc,
    'flow-title': tx.flowTitle,
    'app-title': tx.appTitle, 'app-tap': tx.appTap,
    'app-desc': tx.appDesc, 'app-tip': tx.appTip,
    'score-title': tx.scoreTitle, 'score-desc': tx.scoreDesc,
    'cefr-table-title': tx.cefrTableTitle, 'score-btn-label': tx.scoreBtn,
    'modal-title': tx.modalTitle, 'modal-subtitle': tx.modalSubtitle,
    'json-error': tx.jsonError, 'gen-btn': tx.genBtn,
    'footer-text': tx.footer,
  };
  for (const [id, v] of Object.entries(map)) {
    try { document.getElementById(id).innerHTML = get(v); } catch (e) { console.error('render:', id, e.message); }
  }

  // コマンド一覧
  document.getElementById('commands-list').innerHTML = tx.commands(c).map(([key, desc, style], i) =>
    `<li><span class="step-num" style="background: var(--orange);">${i + 1}</span><div><span class="${style === 'apple' ? 'cmd-apple' : 'cmd'}">${key}</span><span> ${desc}</span></div></li>`
  ).join('');

  // フロー
  document.getElementById('flow-list').innerHTML = tx.flow(c).map((item, i) =>
    `<li><span class="step-num" style="background: var(--${i === 5 ? 'green' : 'lavender'});">${i + 1}</span><div>${item}</div></li>`
  ).join('');

  // スコアカテゴリ
  document.getElementById('cat-grid').innerHTML = tx.cats.map((label, i) =>
    `<div class="cat-item"><span class="cat-dot" style="background:${CAT_COLORS[i]};"></span><span>${label}</span></div>`
  ).join('');

  // アプリカード
  const t = TARGETS[target];
  document.getElementById('app-link').href = t.appUrl;
  document.getElementById('app-icon').src = t.icon;
  document.getElementById('app-name').textContent = t.app;
  const noteEl = document.getElementById('app-note');
  if (t.appUiLang !== native) {
    noteEl.style.display = '';
    noteEl.innerHTML = get(tx.appNote);
  } else {
    noteEl.style.display = 'none';
  }

  // プロンプト
  updatePromptPreview();
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('copied');
  btn.innerHTML = '<span>&#x2398;</span>&nbsp;' + tx.copyBtn;
}

// ---- 操作 ----
function setGuideLang(g) { guideLang = g; persist(); render(); }
function setNative(n) {
  native = n;
  if (target === native) target = native === 'ja' ? 'en' : 'ja'; // 母語=学習言語は無効
  persist(); render();
}
function setTarget(k) { if (k !== native) { target = k; persist(); render(); } }
function setLevel(l) { currentLevel = l; persist(); render(); }
function persist() {
  try {
    localStorage.setItem('aep_guide_state', JSON.stringify({ guideLang, native, target, name: currentName, level: currentLevel }));
  } catch (e) {}
}

function copyPrompt() {
  const tx = T[guideLang];
  const text = buildPrompt(currentName, currentLevel, native, target);
  const btn = document.getElementById('copy-btn');
  const done = () => {
    btn.classList.add('copied');
    btn.innerHTML = '<span>&#x2713;</span>&nbsp;' + tx.copied;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>&#x2398;</span>&nbsp;' + tx.copyBtn;
    }, 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      const el = document.getElementById('prompt-preview');
      const range = document.createRange();
      range.selectNodeContents(el);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    });
  }
}

// ---- スコアチャート ----
const SCORE_LEVELS = [
  { label: 'C2', min: 288, max: 320, stroke: '#b068c8', light: '#ecdaf4', accent: '#e85858' },
  { label: 'C1', min: 240, max: 287, stroke: '#48a0d0', light: '#d8eef8', accent: '#d8b028' },
  { label: 'B2', min: 192, max: 239, stroke: '#60b050', light: '#dff0d8', accent: '#e08030' },
  { label: 'B1', min: 128, max: 191, stroke: '#d8b028', light: '#f8f0cc', accent: '#48a8d8' },
  { label: 'A2', min: 64,  max: 127, stroke: '#e88030', light: '#fcecd8', accent: '#68b858' },
  { label: 'A1', min: 0,   max: 63,  stroke: '#e85858', light: '#fce4e4', accent: '#b070c8' },
];
const MAX_CAT = 40, MAX_TOTAL = 320;

function getScoreLevel(total) { return SCORE_LEVELS.find(l => total >= l.min && total <= l.max) || SCORE_LEVELS[SCORE_LEVELS.length - 1]; }

// 学習言語別の資格試験換算（目安）
function getConversions(total) {
  const pct = total / MAX_TOTAL;
  const ja = guideLang === 'ja';
  if (target === 'en') {
    const toeic = Math.round(pct * 990 / 5) * 5;
    const ielts = (Math.round((1.0 + pct * 8.0) * 2) / 2).toFixed(1);
    const eikenMap = [[0.90, '1級'], [0.75, '準1級'], [0.60, '2級'], [0.45, '準2級'], [0.30, '3級'], [0.15, '4級']];
    let eiken = '5級';
    for (const [th, g] of eikenMap) { if (pct >= th) { eiken = g; break; } }
    return [
      { label: ja ? 'TOEIC換算' : 'TOEIC (est.)', value: toeic, unit: ja ? '点' : 'pts' },
      { label: ja ? 'IELTS換算' : 'IELTS (est.)', value: ielts, unit: '/ 9.0' },
      { label: ja ? '英検換算' : 'Eiken (est.)', value: eiken, unit: '' },
    ];
  }
  if (target === 'fr') {
    const tcf = Math.round(pct * 699);
    const lvl = getScoreLevel(total).label;
    const dip = (lvl === 'C1' || lvl === 'C2') ? `DALF ${lvl}` : `DELF ${lvl}`;
    return [
      { label: ja ? 'TCF換算' : 'TCF (est.)', value: tcf, unit: ja ? '点' : 'pts' },
      { label: ja ? 'DELF/DALF目安' : 'DELF/DALF (est.)', value: dip, unit: '' },
    ];
  }
  if (target === 'ko') {
    const map = [[0.90, 6], [0.75, 5], [0.60, 4], [0.45, 3], [0.30, 2], [0.15, 1]];
    let lv = '—';
    for (const [th, l] of map) { if (pct >= th) { lv = ja ? `${l}級` : `Level ${l}`; break; } }
    return [{ label: ja ? 'TOPIK換算' : 'TOPIK (est.)', value: lv, unit: '' }];
  }
  const map = [[0.85, 'N1'], [0.65, 'N2'], [0.45, 'N3'], [0.25, 'N4'], [0.10, 'N5']];
  let lv = '—';
  for (const [th, l] of map) { if (pct >= th) { lv = l; break; } }
  return [{ label: ja ? 'JLPT換算' : 'JLPT (est.)', value: lv, unit: '' }];
}

function openChartModal()  { document.getElementById('chart-modal').classList.add('open'); }
function closeChartModal() { document.getElementById('chart-modal').classList.remove('open'); }

function generateChart() {
  const tx = T[guideLang];
  const cats = tx.cats;
  const raw = document.getElementById('json-input').value.trim();
  const errEl = document.getElementById('json-error');
  const outEl = document.getElementById('chart-output');
  errEl.classList.remove('show');
  outEl.classList.remove('show');
  outEl.innerHTML = '';
  let parsed;
  try { parsed = JSON.parse(raw); } catch { errEl.classList.add('show'); return; }
  const scores = parsed.scores || {};
  const total = CAT_KEYS.reduce((a, k) => a + (Number(scores[k]) || 0), 0);
  const pal = getScoreLevel(total);
  const pct = total / MAX_TOTAL;

  const cx = 110, cy = 100, r = 70, n = CAT_KEYS.length;
  const toXY  = (i, v) => { const a = (Math.PI * 2 * i / n) - Math.PI / 2; return { x: cx + r * (v / MAX_CAT) * Math.cos(a), y: cy + r * (v / MAX_CAT) * Math.sin(a) }; };
  const toXYF = (i, f) => { const a = (Math.PI * 2 * i / n) - Math.PI / 2; return { x: cx + r * f * Math.cos(a), y: cy + r * f * Math.sin(a) }; };
  const gridLines = [0.25, 0.5, 0.75, 1.0].map(f => {
    const pts = CAT_KEYS.map((_, i) => toXYF(i, f));
    return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') + 'Z';
  });
  const axisLines = CAT_KEYS.map((_, i) => { const e = toXYF(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${e.x.toFixed(1)}" y2="${e.y.toFixed(1)}" stroke="#e0e0e0" stroke-width="1"/>`; }).join('');
  const dataPoints = CAT_KEYS.map((k, i) => toXY(i, scores[k] || 0));
  const dataPath = dataPoints.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') + 'Z';
  const labelEls = CAT_KEYS.map((_, i) => {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lx = cx + (r + 18) * Math.cos(a), ly = cy + (r + 18) * Math.sin(a);
    return `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#333" font-family="'M PLUS Rounded 1c',sans-serif">${cats[i]}</text>`;
  }).join('');
  const radarSVG = `<svg width="220" height="200" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
    ${gridLines.map(d => `<path d="${d}" fill="none" stroke="#e0e0e0" stroke-width="1"/>`).join('')}
    ${axisLines}
    <path d="${dataPath}" fill="${pal.stroke}" fill-opacity="0.35" stroke="#333" stroke-width="2"/>
    ${labelEls}
  </svg>`;
  const cefrRows = SCORE_LEVELS.map(l => {
    const act = l.label === pal.label;
    return `<div style="font-size:${act ? '0.88rem' : '0.63rem'};font-weight:${act ? 800 : 700};color:${act ? 'white' : '#333'};background:${act ? pal.stroke : 'transparent'};border-radius:6px;padding:${act ? '2px 8px' : '1px 4px'};line-height:1.3;white-space:nowrap;">${l.label}</div>`;
  }).join('');
  const convs = getConversions(total);
  const convCards = convs.map(cv =>
    `<div class="sc-conv-card" style="border-color:${pal.stroke};"><div class="sc-conv-label">${cv.label}</div><div class="sc-conv-value" style="color:${pal.stroke};">${cv.value}${cv.unit ? `<span class="sc-conv-unit"> ${cv.unit}</span>` : ''}</div></div>`
  ).join('');
  const commentHTML = parsed.comment ? `<div class="sc-comment-box" style="border-color:${pal.stroke};"><div class="sc-comment-label" style="background:${pal.accent};">${tx.commentLabel}</div><div class="sc-comment-text">${esc(parsed.comment)}</div></div>` : '';
  outEl.innerHTML = `
    <div class="sc-wrap" style="background:${pal.light};">
      <div class="sc-header-badge"><div class="sc-badge" style="background:${pal.stroke};"><span class="sc-dot" style="background:${pal.accent};"></span>${TARGETS[target].project} SCORE<span class="sc-dot" style="background:${pal.accent};"></span></div></div>
      <div class="sc-score-row">
        <div class="sc-cefr-col">${cefrRows}</div>
        <div class="sc-center">
          <div class="sc-score-card"><div class="sc-total" style="color:${pal.stroke};">${total}</div><div style="height:6px;"></div><div class="sc-max">/ ${MAX_TOTAL}</div></div>
          <div class="sc-date">${esc(parsed.date || '')} · Session #${esc(parsed.session || '')}</div>
        </div>
        <div class="sc-bar-col"><div class="sc-bar-wrap">
          <div class="sc-bar-pct" style="color:${pal.accent};">${Math.round(pct * 100)}<span style="font-size:0.5rem;">%</span></div>
          <div class="sc-bar-track" style="background:white;"><div class="sc-bar-fill" style="height:${Math.round(76 * pct)}px;background:${pal.accent};"></div></div>
        </div></div>
      </div>
      <div class="sc-radar-area">${radarSVG}</div>
      <div class="sc-conversion-grid" style="grid-template-columns:repeat(${convs.length},1fr);">${convCards}</div>
      ${commentHTML}
    </div>`;
  outEl.classList.add('show');
}

// ---- 初期化（URLパラメータ > localStorage > 既定値） ----
(function init() {
  try {
    const saved = JSON.parse(localStorage.getItem('aep_guide_state') || 'null');
    if (saved) {
      if (saved.guideLang in T) guideLang = saved.guideLang;
      if (saved.native === 'ja' || saved.native === 'en') native = saved.native;
      if (saved.target in TARGETS) target = saved.target;
      if (typeof saved.name === 'string' && saved.name) currentName = saved.name.slice(0, 20);
      if (LEVELS.includes(saved.level)) currentLevel = saved.level;
    }
  } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get('ui') in T) guideLang = q.get('ui');
  if (q.get('native') === 'ja' || q.get('native') === 'en') native = q.get('native');
  if (q.get('target') in TARGETS) target = q.get('target');
  if (target === native) target = native === 'ja' ? 'en' : 'ja';

  window.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('username-input');
    input.value = currentName;
    input.addEventListener('input', () => {
      currentName = input.value.trim() || 'CA';
      persist();
      render();
    });
    // イベントデリゲーション（ピルはrenderで再生成されるためコンテナ側で拾う）
    document.querySelector('.glang-bar').addEventListener('click', e => {
      const b = e.target.closest('.glang-pill');
      if (b) setGuideLang(b.dataset.glang);
    });
    document.getElementById('native-pills').addEventListener('click', e => {
      const b = e.target.closest('button[data-native]');
      if (b) setNative(b.dataset.native);
    });
    document.getElementById('target-pills').addEventListener('click', e => {
      const b = e.target.closest('button[data-target]');
      if (b) setTarget(b.dataset.target);
    });
    document.getElementById('level-pills').addEventListener('click', e => {
      const b = e.target.closest('button[data-level]');
      if (b) setLevel(b.dataset.level);
    });
    document.getElementById('copy-btn').addEventListener('click', copyPrompt);
    document.getElementById('score-btn').addEventListener('click', openChartModal);
    document.getElementById('modal-close').addEventListener('click', closeChartModal);
    document.getElementById('gen-btn').addEventListener('click', generateChart);
    document.getElementById('chart-modal').addEventListener('click', function (e) {
      if (e.target === this) closeChartModal();
    });
    render();
  });
})();
</script>
