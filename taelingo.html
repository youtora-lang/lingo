<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" id="pwaTitle" content="taelingo">
<link rel="apple-touch-icon" href="./taelingo-icon-1024.png">
<link rel="manifest" href="./taelingo.manifest.json">
<meta name="theme-color" content="#E8E0CC">
<title id="pageTitle">taelingo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lingo.css">
</head>
<body>
<script>
// このファイルはアプリ固有の設定だけを持つ。画面・ロジックはすべて lingo-core.js 側。
window.LINGO_CONFIG={
  prefix:'taelingo',       // localStorageキー・SWファイル名の元。変更禁止（保存データが読めなくなる）
  appNameDefault:'tae',    // アプリ名のデフォルト（appNameDefault+suffix=表示タイトル）
  suffix:'lingo',          // タイトルの末尾（lingo / lingojp）
  uiLang:'ja',             // UI言語（lingo-core.js の STRINGS テーブルを選択）
  targetName:'韓国語',      // 学習対象言語の表示名（UI言語で書く）
  nativeName:'日本語',      // 訳語側の言語の表示名
  ttsLang:'ko-KR',         // 読み上げ（Web Speech API）のロケール
  dateLocale:'ja-JP',      // 学習報告の日付表示ロケール
};
</script>
<script src="./lingo-core.js"></script>
</body>
</html>
