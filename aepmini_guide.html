<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEP mini Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: 'M PLUS Rounded 1c', sans-serif;
  --bg: #f5f0eb;
  --card: #ffffff;
  --border: #333;
  --text: #333;
  --mint: #78c8a8;
  --mint-light: #d8f0e8;
  --coral: #e87870;
  --coral-light: #fce8e6;
  --sky: #68b8e0;
  --sky-light: #d8eef8;
  --gold: #e8c040;
  --gold-light: #f8f0cc;
  --lavender: #b878d0;
  --lavender-light: #ecdaf4;
  --orange: #e89050;
  --orange-light: #fcecd8;
  --green: #5cb87a;
  --green-light: #d6f0df;
}
/* 文字サイズは rem で指定し、端末のフォントサイズ設定に追随させる */
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 1.5rem 16px 3rem;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "★ ✦ ★ ✦ ★ ✦ ★ ✦ ★ ✦ ★";
  position: fixed;
  top: 10px; left: 0; right: 0;
  text-align: center;
  font-size: 0.69rem;
  color: #ccc;
  letter-spacing: 18px;
  pointer-events: none;
  z-index: 0;
}
.page-wrap { max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }

/* --- Guide language toggle (page top) --- */
.glang-bar {
  display: flex; justify-content: center; gap: 8px;
  margin-bottom: 18px;
}
.glang-pill {
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.3em 1.1em; font-family: var(--font);
  font-size: 0.75rem; font-weight: 800; cursor: pointer;
  background: white; color: var(--text);
  transition: transform 0.1s, background 0.15s, color 0.15s;
}
.glang-pill:active { transform: scale(0.95); }
.glang-pill.active { background: var(--border); color: white; }

/* --- Hero --- */
.hero { text-align: center; margin-bottom: 20px; }
.hero-badge {
  display: inline-block; background: var(--coral); color: white;
  border: 2.5px solid var(--border); border-radius: 99px;
  padding: 0.25em 1.4em; font-size: 0.69rem; font-weight: 800;
  letter-spacing: 2px; margin-bottom: 10px;
}
.hero h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
.hero h1 span.accent { color: var(--coral); -webkit-text-stroke: 1.5px var(--border); paint-order: stroke fill; }
.hero p { font-size: 0.75rem; font-weight: 700; color: #888; line-height: 1.7; }

/* --- Cards --- */
.card {
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: 20px; padding: 20px 22px;
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.card-tag {
  position: absolute; top: -1px; left: 18px; color: white;
  border: 2px solid var(--border); border-top: none;
  border-radius: 0 0 10px 10px; font-size: 0.63rem; font-weight: 800;
  padding: 0.25em 1em; letter-spacing: 1px;
}
.card h2 {
  font-size: 1.125rem; font-weight: 800;
  margin-bottom: 12px; margin-top: 8px; line-height: 1.4;
  display: flex; align-items: center; gap: 8px;
}
.card h2 .dot {
  width: 11px; height: 11px; border-radius: 99px;
  border: 2px solid var(--border); display: inline-block; flex-shrink: 0;
}
.card.mint  .card-tag, .card.mint  .dot { background: var(--mint); }
.card.sky   .card-tag, .card.sky   .dot { background: var(--sky); }
.card.gold  .card-tag { background: var(--gold); color: #333; }
.card.gold  .dot { background: var(--gold); }
.card.lavender .card-tag, .card.lavender .dot { background: var(--lavender); }
.card.orange .card-tag, .card.orange .dot { background: var(--orange); }
.card.coral .card-tag, .card.coral .dot { background: var(--coral); }
.card.green .card-tag, .card.green .dot { background: var(--green); }

/* mode blocks */
.mode-block {
  border: 2px dashed var(--border); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 12px;
}
.mode-block:last-child { margin-bottom: 0; }
.mode-label {
  display: inline-block; font-size: 0.63rem; font-weight: 800;
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.3em 1.2em; margin-bottom: 9px; color: white; letter-spacing: 1px;
}
.mode-block p { font-size: 0.9rem; font-weight: 700; line-height: 1.85; color: #444; }
.trigger {
  display: inline-block; background: var(--gold-light);
  border: 1.5px solid var(--gold); border-radius: 8px;
  padding: 0.1em 0.65em; font-size: 0.81rem; font-weight: 800;
  color: #987800; margin: 0 2px;
}

/* tip box */
.tip-box {
  background: var(--gold-light); border: 2px dashed var(--gold);
  border-radius: 14px; padding: 12px 16px;
  font-size: 0.81rem; font-weight: 700; color: #7a6000; line-height: 1.85; margin-top: 12px;
}
.tip-box strong { color: #987800; font-weight: 800; }

/* setup steps */
.setup-step { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
.setup-step:last-child { margin-bottom: 0; }
.setup-step-num {
  width: 30px; height: 30px; border-radius: 99px;
  background: var(--coral); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.88rem; font-weight: 800; color: white;
  flex-shrink: 0; margin-top: 1px;
}
.setup-step-body { flex: 1; min-width: 0; }
.setup-step-title { font-size: 0.97rem; font-weight: 800; margin-bottom: 4px; line-height: 1.45; }
.setup-step-desc { font-size: 0.84rem; font-weight: 700; color: #666; line-height: 1.9; }
.setup-step-desc .hl {
  display: inline-block; background: var(--coral-light);
  border: 1px solid var(--coral); border-radius: 6px;
  padding: 0 7px; color: var(--coral); font-weight: 800;
}
.setup-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, #ddd 0, #ddd 6px, transparent 6px, transparent 12px);
  margin: 14px 0;
}

/* language select box (inside Getting Started) */
.setup-box {
  background: var(--coral-light); border: 2px dashed var(--coral);
  border-radius: 14px; padding: 12px 14px; margin-top: 10px;
}
.setup-box-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.setup-box-row:last-child { margin-bottom: 0; }
.setup-box-label {
  font-size: 0.72rem; font-weight: 800; color: var(--coral);
  white-space: nowrap; min-width: 4.5em;
}
.pill-group { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.lang-pill {
  border: 2px solid var(--border); border-radius: 99px;
  padding: 0.35em 0.9em; font-family: var(--font);
  font-size: 0.75rem; font-weight: 800; cursor: pointer;
  background: white; color: var(--text);
  transition: transform 0.1s, background 0.15s, color 0.15s;
}
.lang-pill:active { transform: scale(0.95); }
.lang-pill.active { background: var(--coral); color: white; }
.lang-pill.disabled { opacity: 0.35; pointer-events: none; }

/* prompt box */
.prompt-box {
  background: #1e1e2e; border: 2px solid var(--border);
  border-radius: 14px; padding: 16px 18px;
  font-family: monospace; font-size: 0.75rem; line-height: 1.8;
  color: #cdd6f4; white-space: pre-wrap; word-break: break-word;
  max-height: 340px; overflow-y: auto; margin-top: 12px;
}
.copy-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 12px; width: 100%; padding: 0.9em 1.5em;
  border-radius: 99px; background: #1e1e2e; color: #cdd6f4;
  border: 2.5px solid var(--border); font-family: var(--font);
  font-size: 0.9rem; font-weight: 800; cursor: pointer; letter-spacing: 1px;
  transition: background 0.15s, color 0.15s;
}
.copy-btn.copied { background: var(--mint); color: white; }

/* app link */
.app-link {
  display: flex; align-items: center; gap: 14px;
  background: white; border: 2px solid var(--border); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 12px; text-decoration: none;
  transition: transform 0.12s, box-shadow 0.12s; box-shadow: 3px 3px 0 var(--border);
}
.app-link:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--border); }
.app-link img {
  width: 52px; height: 52px; border-radius: 12px;
  border: 1.5px solid #ddd; background: white; flex-shrink: 0;
}
.app-link .app-name { font-size: 1rem; font-weight: 800; color: var(--text); }
.app-link .app-sub { font-size: 0.81rem; font-weight: 700; color: #888; margin-top: 3px; }
.app-note {
  font-size: 0.75rem; font-weight: 700; color: #888; line-height: 1.8; margin-top: 10px;
}

.footer { text-align: center; margin-top: 30px; font-size: 0.72rem; font-weight: 700; color: #bbb; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="page-wrap">

  <!-- Guide language toggle -->
  <div class="glang-bar">
    <button class="glang-pill active" data-glang="ja">日本語</button>
    <button class="glang-pill" data-glang="en">English</button>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-badge"><span id="guide-badge">AEP MINI GUIDE</span></div>
    <h1 id="hero-title"></h1>
    <p id="hero-sub"></p>
  </div>

  <!-- Overview -->
  <div class="card mint">
    <div class="card-tag">OVERVIEW</div>
    <h2><span class="dot"></span><span id="ov-title"></span></h2>
    <div class="mode-block" style="background: var(--mint-light); border-color: var(--mint);">
      <p id="ov-body"></p>
    </div>
  </div>

  <!-- How it works -->
  <div class="card orange">
    <div class="card-tag">HOW IT WORKS</div>
    <h2><span class="dot"></span><span id="modes-title"></span></h2>
    <div class="mode-block">
      <div class="mode-label" style="background: var(--orange);" id="mode1-label"></div>
      <p id="mode1-body"></p>
    </div>
    <div class="mode-block">
      <div class="mode-label" style="background: var(--sky);" id="mode2-label"></div>
      <p id="mode2-body"></p>
    </div>
    <div class="tip-box" id="tips-body"></div>
  </div>

  <!-- Getting Started -->
  <div class="card coral">
    <div class="card-tag">GETTING STARTED</div>
    <h2><span class="dot"></span><span id="gs-title"></span></h2>

    <div class="setup-step">
      <div class="setup-step-num">1</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st1-title"></div>
        <div class="setup-step-desc" id="st1-desc"></div>
        <div class="setup-box">
          <div class="setup-box-row">
            <span class="setup-box-label" id="lbl-native"></span>
            <div class="pill-group" id="native-pills"></div>
          </div>
          <div class="setup-box-row">
            <span class="setup-box-label" id="lbl-target"></span>
            <div class="pill-group" id="target-pills"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">2</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st2-title"></div>
        <div class="setup-step-desc" id="st2-desc"></div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">3</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st3-title"></div>
        <div class="setup-step-desc" id="st3-desc"></div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">4</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st4-title"></div>
        <div class="setup-step-desc" id="st4-desc"></div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">5</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st5-title"></div>
        <div class="setup-step-desc" id="st5-desc"></div>
      </div>
    </div>

    <div class="setup-divider"></div>

    <div class="setup-step">
      <div class="setup-step-num">6</div>
      <div class="setup-step-body">
        <div class="setup-step-title" id="st6-title"></div>
        <div class="setup-step-desc" id="st6-desc"></div>
      </div>
    </div>
  </div>

  <!-- Custom Instructions -->
  <div class="card lavender">
    <div class="card-tag">INSTRUCTIONS</div>
    <h2><span class="dot"></span><span id="ci-title"></span></h2>
    <div class="setup-step-desc" style="margin-bottom:4px;" id="ci-note"></div>
    <div class="prompt-box" id="ci-box"></div>
    <button class="copy-btn" id="copy-btn"></button>
  </div>

  <!-- lingo app card -->
  <div class="card green">
    <div class="card-tag">LINGO APP</div>
    <h2><span class="dot"></span><span id="app-title"></span></h2>
    <a id="app-link" class="app-link" href="#" target="_blank">
      <img id="app-icon" src="" alt="lingo app">
      <div>
        <div class="app-name" id="app-name"></div>
        <div class="app-sub" id="app-tap"></div>
      </div>
    </a>
    <div class="mode-block" style="background: var(--green-light); border-color: var(--green);">
      <p id="app-desc"></p>
    </div>
    <div class="app-note" id="app-note" style="display:none;"></div>
  </div>

  <div class="footer"><span id="footer-text"></span></div>
</div>

あなたは${projMini}、${TN}の単語・フレーズの登録補助アシスタントです。以下のルールに厳密に従ってください。

■ 応答ルール（最優先）

- 会話の最初の入力であっても、前置きの挨拶・説明・確認は一切行わない。
- 単語・フレーズの入力を受け取ったら、それが1回目であっても即座にモード1（登録単語確認モード）のカード表示のみを返す。
- 「承知しました」「${projMini}として〜」「登録を開始します」等の応答は不要。最初から本編（カード表示、または「${harvest}」入力時はJSON）のみを返すこと。

■ 入力パターンの判定ルール（最優先）

ユーザーからの入力を受け取ったら、まず以下のどちらに該当するか判定してください。

1. 「${harvest}」という入力 → 常に「JSON出力モード」として扱う。単語・フレーズとして意味を聞かれていると解釈しないこと。
2. 上記以外のテキスト・音声入力 → 「登録単語確認モード」として扱う。

■ モード1：登録単語確認モード

入力された単語・フレーズ（日本語・${TN}どちらでもよい）について、以下を行う。

1. 該当する単語・フレーズの意味と例文を生成し、下記フォーマットでテキスト表示する。必ず1行目に対象語（w）そのものを出力すること。前置き・後置きのコメントは一切つけない。
2. 対象語（w）は必ず${TN}の表現にする。日本語で入力された場合も、対応する自然な${TN}の単語・フレーズに変換して w とすること。
3. jp（意味）フィールドには次を入れる。
   - 日本語で入力された場合：意味の説明文ではなく、入力された元の日本語表現をそのまま jp に入れる。
   - ${TN}で入力された場合：元の入力語そのままにはできないため、自然な日本語の意味説明を jp に入れる。
4. 同時に、この単語を「未出力リスト」に追加する（会話内で記憶しておく）。

表示フォーマット（画面表示用、JSONではない）

必ず1行目に対象語（w）を出力し、続けて各項目を下記の順で出力する。1行目にはラベルを付けず、${TN}の表現に変換した後の w のみを書くこと（この行を絶対に省略しない）。

[w：対象語（${TN}の表現）／ラベルは付けず単語のみ]
${ph.label}：[${ph.spec}]
意味：[jp（上記ルール3に従う）]
例文：[${TN}の例文]
例文訳：[例文の日本語訳]

${sample}

${F}

[件数]件、出力済み

You are ${projMini}, an assistant that helps the user quickly register ${LN} words and phrases. Follow these rules strictly.

■ Response rules (top priority)

- Never open with greetings, explanations, or confirmations — not even on the very first input.
- When you receive a word or phrase, reply immediately with the Mode 1 card only, even the first time.

■ Input classification (top priority)

For every input, first decide which of the following applies:

1. The input "${harvest}" → always JSON export mode. Never interpret it as a word to register.
2. Any other text or voice input → word-card mode.

■ Mode 1: word-card mode

For each word or phrase received (in English or ${LN}):

1. Generate its meaning and an example sentence, and display them as a text card in the format below. The first line must be the target expression (w) itself. No comments before or after.
2. w must always be the ${LN} expression. If the input is English, convert it into a natural ${LN} word or phrase and use that as w.
3. The jp field (meaning):
   - If the input was English: put the original English input as-is into jp (not an explanation).
   - If the input was ${LN}: put a natural English explanation of the meaning into jp.
4. At the same time, add the word to the "pending list" (remember it within this conversation).
5. If a word or phrase already registered in this conversation (exported or not) is entered again, first add one line before the card: "Already registered — updating." Then regenerate the card as usual and overwrite the pending-list entry, so that an already-exported word is included in the next JSON export again.${furiganaRule}

Card format (for display — this is not the JSON)

Always output the target expression (w) on the first line with no label, then the items below in this order (never omit the first line):

[w: the ${LN} expression only, no label]
${ph.label}: [${ph.spec}]
Meaning: [jp (following rule 3 above)]
Example: [example sentence in ${LN}]
Translation: [English translation of the example]

Example output (for the input "Hello"):

${sample}

■ Mode 2: JSON export mode

When you receive "${harvest}":

1. Output every word and phrase in the pending list in the following JSON format, inside a code fence (${F}json). No explanations before or after — output the JSON only.

${F}json
[
  {
    "w": "word or phrase in ${LN}",
    "ph": "${ph.spec}",
    "jp": "the original English input as-is, or an English explanation if the input was in ${LN}",
    "ex": "example sentence in ${LN}",
    "exJp": "English translation of the example"
  }
]
${F}

2. Right after the JSON, add the following line as plain text (not JSON):

[count] items exported

3. Remove the exported items from the pending list. If one is entered again, treat it as an update per Mode 1 rule 5 and add it back to the pending list.`;

// ---- 描画 ----
function ctx() {
  const t = TARGETS[target];
  const appUiName = guideLang === 'ja'
    ? (t.appUiLang === 'ja' ? '日本語' : '英語')
    : (t.appUiLang === 'ja' ? 'Japanese' : 'English');
  return {
    app: t.app, appUrl: t.appUrl, icon: t.icon,
    project: t.project,
    harvest: HARVEST[native],
    sampleInput: native === 'ja' ? 'こんにちは' : 'Hello',
    appUiName,
    nName: NATIVE_NAMES[guideLang][native],
  };
}

function buildPills() {
  // クリック処理はコンテナ側のイベントデリゲーションで拾う（インラインonclickは使わない）
  const np = document.getElementById('native-pills');
  np.innerHTML = ['ja', 'en'].map(n =>
    `<button class="lang-pill${n === native ? ' active' : ''}" data-native="${n}">${n === 'ja' ? '🇯🇵' : '🇺🇸'} ${NATIVE_NAMES[guideLang][n === 'ja' ? 'ja' : 'en']}</button>`
  ).join('');
  const tp = document.getElementById('target-pills');
  tp.innerHTML = Object.keys(TARGETS).map(k => {
    const dis = k === native ? ' disabled' : '';
    return `<button class="lang-pill${k === target ? ' active' : ''}${dis}" data-target="${k}">${TARGETS[k].flag} ${LANG_NAMES[guideLang][k]}</button>`;
  }).join('');
}

function render() {
  const tx = T[guideLang];
  const c = ctx();
  const get = v => (typeof v === 'function' ? v(c) : v);
  document.documentElement.lang = guideLang;
  document.title = get(tx.title);
  document.querySelectorAll('.glang-pill').forEach(p => p.classList.toggle('active', p.dataset.glang === guideLang));
  buildPills();

  const map = {
    'guide-badge': tx.badge, 'hero-title': tx.heroTitle, 'hero-sub': tx.heroSub,
    'ov-title': tx.ovTitle, 'ov-body': tx.ovBody,
    'modes-title': tx.modesTitle,
    'mode1-label': tx.mode1Label, 'mode1-body': tx.mode1Body,
    'mode2-label': tx.mode2Label, 'mode2-body': tx.mode2Body,
    'tips-body': tx.tipsBody,
    'gs-title': tx.gsTitle,
    'lbl-native': tx.lblNative, 'lbl-target': tx.lblTarget,
    'st1-title': tx.st1Title, 'st1-desc': tx.st1Desc,
    'st2-title': tx.st2Title, 'st2-desc': tx.st2Desc,
    'st3-title': tx.st3Title, 'st3-desc': tx.st3Desc,
    'st4-title': tx.st4Title, 'st4-desc': tx.st4Desc,
    'st5-title': tx.st5Title, 'st5-desc': tx.st5Desc,
    'st6-title': tx.st6Title, 'st6-desc': tx.st6Desc,
    'ci-title': tx.ciTitle, 'ci-note': tx.ciNote,
    'app-title': tx.appTitle, 'app-tap': tx.appTap, 'app-desc': tx.appDesc,
    'footer-text': tx.footer,
  };
  for (const [id, v] of Object.entries(map)) {
    try { document.getElementById(id).innerHTML = get(v); } catch (e) { console.error('render:', id, e.message); }
  }

  document.getElementById('ci-box').textContent = buildCI(native, target);
  document.getElementById('copy-btn').innerHTML = '<span>&#x2398;</span>&nbsp;' + tx.copyBtn;
  document.getElementById('copy-btn').classList.remove('copied');

  const t = TARGETS[target];
  document.getElementById('app-link').href = t.appUrl;
  document.getElementById('app-icon').src = t.icon;
  document.getElementById('app-name').textContent = t.app;
  const noteEl = document.getElementById('app-note');
  if (t.appUiLang !== native) {
    noteEl.style.display = '';
    noteEl.innerHTML = get(tx.appNote);
  } else {
    noteEl.style.display = 'none';
  }
}

// ---- 操作 ----
function setGuideLang(g) { guideLang = g; persist(); render(); }
function setNative(n) {
  native = n;
  if (target === native) target = native === 'ja' ? 'en' : 'ja'; // 母語=学習言語は無効
  persist(); render();
}
function setTarget(k) { if (k !== native) { target = k; persist(); render(); } }
function persist() {
  try { localStorage.setItem('aepmini_guide_state', JSON.stringify({ guideLang, native, target })); } catch (e) {}
}

function copyInstructions() {
  const tx = T[guideLang];
  const text = buildCI(native, target);
  const btn = document.getElementById('copy-btn');
  const done = () => {
    btn.classList.add('copied');
    btn.innerHTML = '<span>&#x2713;</span>&nbsp;' + tx.copied;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>&#x2398;</span>&nbsp;' + tx.copyBtn;
    }, 1800);
  };
  const fallbackCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert(tx.copyFail); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

// ---- 初期化（URLパラメータ > localStorage > 既定値） ----
(function init() {
  try {
    const saved = JSON.parse(localStorage.getItem('aepmini_guide_state') || 'null');
    if (saved) {
      if (saved.guideLang in T) guideLang = saved.guideLang;
      if (saved.native === 'ja' || saved.native === 'en') native = saved.native;
      if (saved.target in TARGETS) target = saved.target;
    }
  } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get('ui') in T) guideLang = q.get('ui');
  if (q.get('native') === 'ja' || q.get('native') === 'en') native = q.get('native');
  if (q.get('target') in TARGETS) target = q.get('target');
  if (target === native) target = native === 'ja' ? 'en' : 'ja';
  window.addEventListener('DOMContentLoaded', () => {
    // イベントデリゲーション（ピルはrenderで再生成されるためコンテナ側で拾う）
    document.querySelector('.glang-bar').addEventListener('click', e => {
      const b = e.target.closest('.glang-pill');
      if (b) setGuideLang(b.dataset.glang);
    });
    document.getElementById('native-pills').addEventListener('click', e => {
      const b = e.target.closest('button[data-native]');
      if (b) setNative(b.dataset.native);
    });
    document.getElementById('target-pills').addEventListener('click', e => {
      const b = e.target.closest('button[data-target]');
      if (b) setTarget(b.dataset.target);
    });
    document.getElementById('copy-btn').addEventListener('click', copyInstructions);
    render();
  });
})();
</script>
